<script>
const W=1080,H=1920,CX=540;
const c=document.getElementById('c'),g=c.getContext('2d');
const PINK='#FF318C',ORANGE='#FC801D',PURPLE='#6B57FF',BLUE='#087CFA',YEL='#FDB60D',VIOL='#B74AF7';
const IMG={};['logo.webp','war.jpg','praha.jpg'].forEach(n=>{const i=new Image();i.src=n;IMG[n]=i});
function photo(im,alpha,zoom,ox=0,oy=0,filter='none',over=.55){if(alpha<=0)return;const s=Math.max(W/im.width,H/im.height)*zoom;const w=im.width*s,h=im.height*s;g.save();g.globalAlpha=alpha;g.filter=filter;g.drawImage(im,(W-w)/2+ox,(H-h)/2+oy,w,h);g.filter='none';const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,`rgba(0,0,0,${over})`);gr.addColorStop(.5,`rgba(0,0,0,${over*.6})`);gr.addColorStop(1,`rgba(0,0,0,${Math.min(1,over+.35)})`);g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore()}
function credit(a){T('ilustrační foto',1040,1880,24,{mono:1,weight:400,color:'#aaa',align:'right',alpha:a})}
function logoCard(x,y,w,a,sc=1){if(a<=0)return;const im=IMG['logo.webp'];const h=w*im.height/im.width;g.save();g.globalAlpha=a;g.translate(x,y);g.scale(sc,sc);g.fillStyle='#fff';rr(-w/2-50,-h/2-45,w+100,h+90,36);g.fill();g.drawImage(im,-w/2,-h/2,w,h);g.restore()}
const DISPLAY="'Inter Display'",MONO="'JBMono'";
const BPM=124,BEAT=60/BPM;

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;

function grad(x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>gr.addColorStop(i/(stops.length-1),s));return gr}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}

// text with pop animation
function T(str,x,y,size,o={}){
  const a=o.alpha??1; if(a<=0)return;
  const sc=o.scale??1, w=o.weight??900, fam=o.mono?MONO:DISPLAY;
  g.save(); g.globalAlpha=a; g.translate(x,y); g.scale(sc,sc); if(o.rot)g.rotate(o.rot);
  g.font=`${o.mono?(o.weight??700):w} ${size}px ${fam}`; g.textAlign=o.align||'center'; g.textBaseline='middle';
  if(o.ls)g.letterSpacing=o.ls+'px';
  if(o.grad){const m=g.measureText(str).width;const x0=o.align==='left'?0:-m/2;g.fillStyle=grad(x0,-size/2,x0+m,size/2,o.grad)}
  else g.fillStyle=o.color||'#fff';
  if(o.shadow){g.shadowColor='rgba(0,0,0,.75)';g.shadowBlur=24}
  g.fillText(str,0,0);
  g.restore();
}
// pop helper -> {alpha,scale}
function pop(t,at,dur=.35,from=.6){const p=prog(t,at,dur);return{alpha:clamp(p*2.5),scale:lerp(from,1,eBack(p))}}
function slam(t,at){const p=prog(t,at,.22);return{alpha:clamp(p*3),scale:lerp(1.8,1,eOut(p))}}
function rise(t,at,dur=.4){const p=eOut(prog(t,at,dur));return{alpha:p,dy:(1-p)*60}}

// ---------- background: rotating stacked rounded squares (JetBrains key-visual feel)
function bg(t,mode){
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  const beatP=(t%BEAT)/BEAT, pulse=1+0.025*Math.exp(-beatP*7);
  const cfg=mode.bg||{};
  const cx=cfg.x??CX, cy=cfg.y??H*0.5, base=(cfg.size??900)*pulse, n=11;
  const dim=cfg.dim??0.55;
  const pal=cfg.red?['#3a0a0a','#5a0f12','#7a1418','#a01c1f','#c4282a']:[BLUE,PURPLE,VIOL,PINK,ORANGE,YEL];
  g.save(); g.translate(cx,cy);
  const spin=t*(cfg.spin??0.12);
  for(let i=0;i<n;i++){
    const k=i/(n-1), s=base*(1-k*0.78);
    g.save(); g.rotate(spin+k*1.9);
    const col=pal[Math.min(pal.length-1,Math.floor(k*(pal.length-1)+0.5))];
    const col2=pal[Math.min(pal.length-1,Math.floor(k*(pal.length-1))+1)]||col;
    g.globalAlpha=dim*(0.35+0.65*k);
    g.fillStyle=grad(-s/2,-s/2,s/2,s/2,[col,col2]);
    rr(-s/2,-s/2,s,s,s*0.16); g.fill();
    g.globalAlpha=dim*0.5; g.strokeStyle='rgba(255,255,255,.25)'; g.lineWidth=2; g.stroke();
    g.restore();
  }
  g.restore();
  // vignette + dark overlay for legibility
  const v=g.createRadialGradient(CX,H/2,200,CX,H/2,1200); v.addColorStop(0,'rgba(0,0,0,'+(cfg.over??0.35)+')'); v.addColorStop(1,'rgba(0,0,0,.92)');
  g.fillStyle=v; g.fillRect(0,0,W,H);
  // grain
  g.globalAlpha=0.05; for(let i=0;i<220;i++){const r=Math.sin(i*91.7+t*13.1)*43758.5453;const f=r-Math.floor(r);const r2=Math.sin(i*12.9+t*7.7)*24634.6;const f2=r2-Math.floor(r2);g.fillStyle=i%2?'#fff':'#000';g.fillRect(f*W,f2*H,2,2)} g.globalAlpha=1;
}

  g.fillStyle='#2B2D30'; rr(x,y,w,70,[28,28,0,0]); g.fill();
  ['#FF5F57','#FEBC2E','#28C840'].forEach((c2,i)=>{g.fillStyle=c2;g.beginPath();g.arc(x+44+i*36,y+35,11,0,7);g.fill()});
  T(title,x+170,y+36,28,{mono:1,weight:400,color:'#A9B7C6',align:'left'});
  let budget=Math.max(0,(t-start)*cps), ly=y+130, last=null;
  g.font=`400 36px ${MONO}`; g.textBaseline='middle'; g.textAlign='left';
  for(const ln of lines){
    let lx=x+40; T(String(lines.indexOf(ln)+1),x+28,ly,26,{mono:1,weight:400,color:'#4E5157',align:'left'});
    lx=x+80;
    for(const [txt,col] of ln){
      const n=Math.min(txt.length,Math.floor(budget)); if(n<=0)break;
      g.font=`400 36px ${MONO}`; g.fillStyle=col; g.fillText(txt.slice(0,n),lx,ly); lx+=g.measureText(txt.slice(0,n)).width; budget-=n; last=[lx,ly];
      if(n<txt.length){budget=0;break}
    }
    if(budget<=0&&last)break; ly+=56;
  }
  if(last&&Math.floor(t*2.5)%2===0){g.fillStyle=ORANGE;g.fillRect(last[0]+4,last[1]-22,18,44)}
}

function wrap(str,maxW){g.font=`700 50px ${DISPLAY}`;const ws=str.split(' ');const out=[];let cur='';for(const w of ws){const tr=cur?cur+' '+w:w;if(g.measureText(tr).width>maxW&&cur){out.push(cur);cur=w}else cur=tr}out.push(cur);return out}
function subs(t){
  const s=SUBS.find(s=>t>=s[0]-0.05&&t<s[1]+0.25); if(!s)return;
  const lines=wrap(s[2],880); const a=clamp((t-s[0]+0.05)/0.12)*clamp((s[1]+0.25-t)/0.12);
  lines.forEach((l,i)=>T(l,CX,1480+i*64,50,{weight:700,alpha:a,shadow:1}));
}

window.renderFrame=function(t){
  const sc=SC.find(s=>t>=s.a&&t<s.b)||SC[SC.length-1];

};
