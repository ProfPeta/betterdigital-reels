</style></head><body>
<div id="bg"></div><div id="glow"></div><canvas id="pc"></canvas><div id="stage"></div>
<div id="fx"><div id="flash"></div></div>
<div class="bar" id="barT" style="top:0"></div><div class="bar" id="barB" style="bottom:0"></div>
<div id="vig"></div><canvas id="grain"></canvas>
<script>
const W=innerWidth,H=innerHeight,V=H>W,U=Math.min(W,H)/100*(V?1:1.1),DPR=devicePixelRatio||1;
const D=Math.min(W*(V?.86:.62),U*(V?100:92));
document.documentElement.style.setProperty('--u',U+'px');document.documentElement.style.setProperty('--d',D/100+'px');
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3), e5=x=>1-Math.pow(1-clamp(x),5), ei=x=>Math.pow(clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const el=(tag,cls,html,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function rise(e,lt,t0,d=.5,dist=2.2){if(lt<t0){e.style.opacity=0;return}const q=eo((lt-t0)/d);e.style.opacity=q;e.style.filter=q<1?`blur(${(1-q)*U*1.2}px)`:'none';e.style.transform=`translateY(${(1-q)*U*dist}px)`}
function pop(e,lt,t0,d=.35){if(lt<t0){e.style.opacity=0;return}const p=clamp((lt-t0)/d);e.style.opacity=clamp(p*3);e.style.transform=`scale(${.6+.4*back(p)})`}
function slam(e,lt,t0,d=.22,k=.4){if(lt<t0){e.style.opacity=0;return}const p=e5((lt-t0)/d);e.style.opacity=1;e.style.transform=`scale(${1+k*(1-p)})`;e.style.filter=p<1?`blur(${(1-p)*U*.8}px)`:'none'}
function typedGlow(e,full,t,t0,t1,caret=true){const p=clamp((t-t0)/(t1-t0));const n=Math.round(full.length*p);const s=full.slice(0,n);
  const cut=s.lastIndexOf(' ')+1;const typing=t>=t0&&t<t1+.35;const glowOn=t>=t0&&t<t1+.5;
  let h=esc(s.slice(0,cut))+(glowOn?`<span class="gw">${esc(s.slice(cut))}</span>`:esc(s.slice(cut)));
  if(caret&&typing&&(p<1||Math.floor(t*3)%2==0))h+='<b class="caret"></b>';if(e.innerHTML!==h)e.innerHTML=h}
const ARROW='<svg viewBox="0 0 18 22" width="100%" height="100%"><path d="M1.5 1.5v16.2l4.3-4 3 6.6 3-1.3-3-6.5h6z" fill="#fff" stroke="#0B0B0B" stroke-width="1.3" stroke-linejoin="round"/></svg>';
const CHECK=(c='#0B0B0B',s='60%')=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={
 web:sv('<rect x="3" y="4.5" width="18" height="15" rx="2.2"/><path d="M3 9h18M7 13h6M7 16h4"/>'),
 auto:sv('<circle cx="5" cy="12" r="2.6"/><circle cx="19" cy="5.5" r="2.6"/><circle cx="19" cy="18.5" r="2.6"/><path d="M7.4 11l9.2-4.3M7.4 13l9.2 4.3"/>'),
 team:sv('<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.6-3.3 2.9-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.6c2.3.1 4 1.6 4.7 4.4"/>'),
 mail:sv('<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>'),
 ai:sv('<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>'),
 book:sv('<rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M8 8h8M8 11.5h8M8 15h5"/>'),
 ok:sv('<circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.8 2.8L16.2 9.6"/>'),
 plus:sv('<path d="M12 6v12M6 12h12"/>'),
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V6M6.5 11.5L12 6l5.5 5.5"/></svg>',
 inv:sv('<path d="M6 3.5h9l3 3v14H6z"/><path d="M9 11h6M9 14.5h6M9 8h3"/>'),
 chat:sv('<path d="M4 5.5h16v10H9l-4.5 3.5v-3.5H4z"/>'),
 sheet:sv('<rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M3.5 9h17M3.5 14h17M9 4v16M14.5 4v16"/>'),
 phone:sv('<path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 005.5 5.5l1.5-2 4 1.5v3a2 2 0 01-2 2A15 15 0 014.5 5.5a2 2 0 012-2z"/>'),
 cal:sv('<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
 box:sv('<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>')};
function uzel(parent,h){const w=h*3.8;const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',w);s.setAttribute('height',h);s.style.overflow='visible';
  const sw=h*.1,r=h/2-sw/2;
  s.innerHTML=`<circle cx="${h/2}" cy="${h/2}" r="${r}" fill="none" stroke="#fff" stroke-width="${sw}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" transform="rotate(-90 ${h/2} ${h/2})"/><line x1="${h}" y1="${h/2}" x2="${w-h}" y2="${h/2}" stroke="#fff" stroke-width="${sw}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`;
  const box=el('div',null,null,parent);Object.assign(box.style,{position:'relative',width:w+'px',height:h+'px',flex:'none'});box.appendChild(s);
  const dot=el('div',null,null,box);Object.assign(dot.style,{position:'absolute',width:h+'px',height:h+'px',left:0,top:0,borderRadius:'50%',background:'#FFD400',boxShadow:`0 0 ${h*.5}px rgba(255,212,0,.9),0 0 ${h*1.4}px rgba(255,212,0,.45)`});
  const [ring,line]=s.children;return{box,ring,line,dot,w,h}}
function setUzel(u,ringP,lineP,dotX,dotS,dotA){u.ring.setAttribute('stroke-dashoffset',1-ringP);u.line.setAttribute('stroke-dashoffset',1-lineP);u.dot.style.transform=`translateX(${dotX}px) scale(${dotS})`;u.dot.style.opacity=dotA}
function persp(){return `perspective(${U*170}px) `}

/* ======= global effects ======= */
const FLASH=[[7.35,.55],[10.35,.12],[17.4,.14],[22.35,.08],[27.1,.1],[31.35,.22],[32.35,.22],[33.35,.22],[34.85,.5],[36.35,.25],[39.35,.22]];
const SHAKE=[...[.6,1.1,1.6,2.1,2.6,3.1,3.6,4.1,4.6].map(t=>[t,.35]),[4.85,.6],[7.35,1.4],[10.35,.45],[17.35,.3],[31.35,.7],[32.35,.7],[33.35,.7],[34.85,1.2],[36.35,.9]];
const FLARES=[[7.35,.5,1],[10.35,.44,.6],[34.85,.5,1],[39.35,.42,.7]];
const STREAKS=[[8.8,-26,.28],[8.9,-22,.55],[9.0,-30,.18],[9.08,-25,.72],[12.1,-8,.4],[12.15,-12,.62],[23.55,-6,.35],[23.6,-10,.6],[34.55,-20,.35],[34.62,-24,.6],[38.55,-28,.3],[38.62,-24,.55]];
const fx=document.getElementById('fx');const flares=FLARES.map(()=>el('div','flare',null,fx));const streaks=STREAKS.map(()=>el('div','streak',null,fx));
function flashAt(t){let v=0;for(const[a,i]of FLASH)if(t>=a)v=Math.max(v,i*Math.exp(-(t-a)/.09));return v}
function shakeAt(t){let x=0,y=0,r=0;for(const[a,i]of SHAKE)if(t>=a&&t<a+.6){const k=i*Math.exp(-(t-a)/.1)*U*1.1;x+=Math.sin(t*173+a*5)*k;y+=Math.cos(t*211+a*3)*k;r+=Math.sin(t*97+a)*k*.02}return[x,y,r]}
function drawFx(t){document.getElementById('flash').style.opacity=flashAt(t);
  FLARES.forEach(([a,yf,k],i)=>{const e=flares[i];const d=t-a;if(d<0||d>1.4){e.style.opacity=0;return}const w=Math.max(W,H)*(.6+d*.9);e.style.width=w+'px';e.style.marginLeft=(-w/2)+'px';e.style.top=H*yf+'px';e.style.opacity=k*Math.exp(-d/.35)});
  STREAKS.forEach(([t0,ang,yf],i)=>{const e=streaks[i];const p=(t-t0)/.4;if(p<0||p>1){e.style.opacity=0;return}const len=Math.max(W,H)*.75;e.style.width=len+'px';
    const x=lerp(-len,W+len*.2,eio(p));e.style.opacity=Math.sin(p*Math.PI);e.style.transform=`translate(${x}px,${H*yf+(W-x)*Math.tan(-ang*Math.PI/180)*.35}px) rotate(${ang}deg)`})}
// letterbox: closed-ish during the cold open, opens on the reveal, closes at the end
const barT=document.getElementById('barT'),barB=document.getElementById('barB');
function drawBars(t){const full=H*(V?.085:.11);let k=t<7.35?1:1-e5((t-7.35)/.9);if(t>43.9)k=Math.max(k,eio((t-43.9)/.9)*(V?5.9:4.6));const h=full*k;barT.style.height=h+'px';barB.style.height=h+'px'}
// glow + bokeh particles
const glow=document.getElementById('glow');const GS=Math.max(W,H)*1.3;glow.style.width=GS+'px';glow.style.height=GS+'px';
function drawGlow(t){const gx=W*(.5+.3*Math.sin(t*.21+.6)),gy=H*(.55+.12*Math.cos(t*.29));let k=.8+.2*Math.sin(t*.7);
  if(t<5.4)k*=.25; else if(t<7.35)k*=.25+.75*clamp((t-6.2)/1.1);if(t>44.2)k*=clamp((45-t)/.8);glow.style.transform=`translate(${gx-GS/2}px,${gy-GS/2}px)`;glow.style.opacity=k}
const pc=document.getElementById('pc');pc.width=W*DPR;pc.height=H*DPR;const pg=pc.getContext('2d');pg.scale(DPR,DPR);
const R=mul(7);const BOKEH=[];for(let i=0;i<60;i++)BOKEH.push({x:R(),y:R(),z:R(),r:R(),ph:R()*6.28,y2:R()<.8});
const BURST=[];for(let i=0;i<140;i++)BURST.push({a:R()*6.283,s:.2+R()*.8,z:R(),yl:R()<.75});
function drawParticles(t){pg.clearRect(0,0,W,H);let amb=t<7.35?0:clamp((t-7.35)/1.2);if(t>44)amb*=clamp((45-t)/1);
  for(const b of BOKEH){const par=.4+b.z;const x=((b.x*W+Math.sin(t*.13*par+b.ph)*U*6+t*U*.5*par)%(W+40)+W+40)%(W+40)-20;const y=((b.y*H-t*U*1.2*par)%(H+40)+H+40)%(H+40)-20;
    const rad=U*(.4+b.z*1.6);const a=amb*(.08+.22*b.z)*(.6+.4*Math.sin(t*1.3+b.ph));if(a<.01)continue;const g=pg.createRadialGradient(x,y,0,x,y,rad*2.5);
    const c=b.y2?'255,212,0':'255,255,255';g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);pg.fillStyle=g;pg.beginPath();pg.arc(x,y,rad*2.5,0,6.283);pg.fill()}
  for(const t0 of [7.35,34.85]){const d=t-t0;if(d<0||d>2.4)continue;for(const b of BURST){const dist=Math.max(W,H)*.55*b.s*e5(d/1.6);const x=W/2+Math.cos(b.a)*dist,y=H*(t0>30?.5:.47)+Math.sin(b.a)*dist*.8;
      const a=(1-d/2.4)*(.35+.65*b.z);pg.fillStyle=b.yl?`rgba(255,212,0,${a})`:`rgba(255,255,255,${a*.8})`;pg.beginPath();pg.arc(x,y,U*(.12+.35*b.z),0,6.283);pg.fill()}}}
// subtle film grain
const grain=document.getElementById('grain');grain.width=Math.ceil(W/1.6);grain.height=Math.ceil(H/1.6);const gctx=grain.getContext('2d');const tiles=[];
(function(){const gr=mul(9);for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const id=x.createImageData(256,256);
  for(let i=0;i<id.data.length;i+=4){const v=gr()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}x.putImageData(id,0,0);tiles.push(gctx.createPattern(c,'repeat'))}})();
function drawGrain(t){const f=Math.floor(t*12);gctx.save();gctx.clearRect(0,0,grain.width,grain.height);gctx.translate(-(f*97)%256,-(f*57)%256);gctx.fillStyle=tiles[f%6];gctx.fillRect(0,0,grain.width+256,grain.height+256);gctx.restore()}

/* ======= scenes ======= */
