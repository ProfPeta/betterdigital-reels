<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>POSTAVILI TO · Česká edice #1 – Avast</title>
<style>
@font-face{font-family:IT;src:url(../../engine/fonts/InterTight-Variable.ttf);font-weight:100 900}
@font-face{font-family:JB;src:url(../../engine/fonts/jetbrains-mono-latin-ext-500-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:JB;src:url(../../engine/fonts/jetbrains-mono-latin-500-normal.woff2);unicode-range:U+0000-00FF,U+2013-201E,U+2026,U+2212}
@font-face{font-family:VT;src:url(../../engine/fonts/vt323-latin-ext-400-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:VT;src:url(../../engine/fonts/vt323-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+2013-201E,U+2026}
:root{--or:#FF7800;--navy:#10131C;--grn:#3BFF7E;--red:#E5322D;--y:#FFD400;--g:#9AA3B5}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:#000}
body{font-family:IT,'Noto Color Emoji',sans-serif;-webkit-font-smoothing:antialiased;position:relative;color:#fff}
.abs{position:absolute}
#stage{position:absolute;left:0;top:0;width:540px;height:960px;z-index:0}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
.cam{position:absolute;inset:0;transform-origin:50% 45%}
.navy{background:var(--navy)}.crt{background:#030805}.paper{background:#ECECE8;color:#111}.white{background:#fff;color:#111}
.dred{background:#140405}.orange{background:var(--or)}.teal{background:#0d7a7a}.board{background:#0B0B0B}.warm{background:#150e08}.dark{background:#08090c}
.mono{font-family:JB,monospace;letter-spacing:.06em;white-space:nowrap}
.vt{font-family:VT,monospace;line-height:1}
.lbl{font-family:JB;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);white-space:nowrap}
.big{font-weight:900;letter-spacing:-.045em;line-height:.95;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--y);color:#0E0E0E;font-weight:900;font-size:19px;letter-spacing:-.01em;padding:6px 12px 6px;border-radius:6px}
.badge b{font-family:JB;font-size:11px;font-weight:500;letter-spacing:.12em}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px 5px;font-family:JB;font-size:13px;letter-spacing:.08em;white-space:nowrap}
.stamp{display:inline-block;font-weight:900;font-size:50px;color:var(--red);border:6px solid var(--red);padding:2px 18px 4px;letter-spacing:.02em;line-height:1.05;white-space:nowrap;border-radius:6px}
.stamp.bl{color:#3438A8;border-color:#3438A8}
.card{position:absolute;background:#fff;color:#111;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.oscr{position:absolute;background:radial-gradient(120% 120% at 50% 40%,#0f4a24,#03140a);box-shadow:0 0 22px rgba(59,255,126,.45),inset 0 0 14px rgba(0,0,0,.85);border-radius:8px;overflow:hidden;color:var(--grn);font-family:VT}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);pointer-events:none}
.glow{text-shadow:0 0 18px rgba(59,255,126,.65)}
/* titulky */
#cap{position:absolute;left:40px;right:40px;text-align:center;pointer-events:none;z-index:3}
#cap span{display:inline;background:rgba(10,10,10,.84);color:#fff;font-weight:850;font-size:30px;letter-spacing:-.02em;line-height:1.5;padding:4px 12px;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:5px}
#cap b{font-weight:850;background:var(--or);color:#fff;padding:0 6px;border-radius:3px}
/* časová osa 1988–2026 */
#tl{position:absolute;left:74px;width:392px;top:122px;height:36px;pointer-events:none;z-index:2}
#tl .ln{position:absolute;left:0;right:0;top:24px;height:1.5px;background:rgba(255,255,255,.35)}
#tl .pg{position:absolute;left:0;top:24px;height:1.5px;background:#fff}
#tl .ev{position:absolute;top:20px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:#000}
#tl .ev.p{background:#fff;border-color:#fff}
#tl .cur{position:absolute;top:17px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,120,0,.55),0 0 14px rgba(255,255,255,.7)}
#tl .yr{position:absolute;top:0;transform:translateX(-50%);font-family:JB;font-size:13px;letter-spacing:.1em;color:#fff;white-space:nowrap}
#tl.dk .ln{background:rgba(0,0,0,.25)}#tl.dk .pg{background:#111}#tl.dk .ev{border-color:rgba(0,0,0,.45);background:#fff}#tl.dk .ev.p{background:#111;border-color:#111}
#tl.dk .cur{background:#111;box-shadow:0 0 0 4px rgba(255,120,0,.55)}#tl.dk .yr{color:#111}
#gl{position:absolute;inset:0;pointer-events:none;z-index:4}
#scanl{position:absolute;left:0;width:540px;height:3px;background:#fff;box-shadow:0 0 18px 4px rgba(255,255,255,.8);display:none;pointer-events:none;z-index:4}
#grain{position:absolute;left:0;top:0;width:540px;height:960px;pointer-events:none;z-index:5}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
</style></head><body>
<div id="stage"></div>
<div id="tl"></div>
<div id="cap"></div>
<div id="gl"></div><div id="scanl"></div>
<canvas id="grain" width="180" height="320"></canvas>
<div id="flash"></div>
<script src="timeline.js"></script>
<script>
const FPS=30;const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3),e5=x=>1-Math.pow(1-clamp(x),5);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;const $=id=>document.getElementById(id);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function uzel(h,col){const w=h*3.8,sw=h*.12,r=h/2-sw/2;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;display:block"><circle cx="${h/2}" cy="${h/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/><line x1="${h}" y1="${h/2}" x2="${w-h}" y2="${h/2}" stroke="${col}" stroke-width="${sw}"/><circle cx="${w-h/2}" cy="${h/2}" r="${h/2}" fill="#FFD400"/></svg>`}
const FLAG=w=>`<svg width="${w}" height="${w*2/3}" viewBox="0 0 24 16" style="display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)"><rect width="24" height="16" fill="#fff"/><rect y="8" width="24" height="8" fill="#D7141A"/><path d="M0 0 L12 8 L0 16Z" fill="#11457E"/></svg>`;
const FLAG_IT=w=>`<svg width="${w}" height="${w*2/3}" viewBox="0 0 24 16" style="display:block;border-radius:2px"><rect width="8" height="16" fill="#009246"/><rect x="8" width="8" height="16" fill="#fff"/><rect x="16" width="8" height="16" fill="#CE2B37"/></svg>`;
const T=window.TL;const st=s=>T.S[s][0],en=s=>T.S[s][1];
const CK={};T.chunks.forEach(([s,i,txt,a,b])=>{(CK[s]=CK[s]||[])[i]=[a,b,txt]});
const ck=(s,i)=>CK[s][i][0];
window.DURATION=T.END;
function slamT(u,s0=1.35,amp=7){const p=e5(u/.1),k=Math.exp(-Math.max(0,u)/.13);
  return `translate(${(amp*k*Math.sin(u*97+1.1)).toFixed(2)}px,${(amp*.7*k*Math.sin(u*83+.3)).toFixed(2)}px) scale(${lerp(s0,1,p).toFixed(4)})`}
function rgbSplit(u,d=.2,px=6){const r=u>=0&&u<d?px*(1-u/d):0;return r>0?`${r.toFixed(2)}px 0 rgba(255,30,60,.85),${(-r).toFixed(2)}px 0 rgba(0,200,255,.85)`:'none'}
const popIn=(e,t,a,d=.22,s0=.6)=>{e.style.opacity=t>=a?1:0;e.style.transform=`scale(${lerp(s0,1,back((t-a)/d)).toFixed(4)})`};
const slideIn=(e,t,a,dy=24,d=.3)=>{const p=e5((t-a)/d);e.style.opacity=t>=a?p:0;e.style.transform=`translateY(${(dy*(1-p)).toFixed(1)}px)`};
const slideX=(e,t,a,dx=60,d=.35)=>{const p=e5((t-a)/d);e.style.opacity=t>=a?p:0;e.style.transform=`translateX(${(dx*(1-p)).toFixed(1)}px)`};
const stampIn=(e,t,a,rot=-8,s0=1.8)=>{e.style.opacity=t>=a?1:0;if(t>=a)e.style.transform=`rotate(${rot}deg) `+slamT(t-a,s0,6)};
const fade=(e,t,a,d=.25)=>{e.style.opacity=clamp((t-a)/d).toFixed(3)};
const fadeOut=(e,t,a,d=.25)=>{const o=1-clamp((t-a)/d);e.style.opacity=o.toFixed(3);return o};
/* Olivetti M24 (fotka od Petra) se zelenou obrazovkou: obrazovka = 35,7 % / 7,6 % / 28,9 % × 27 % výřezu */
function OLI(w,id,scr=''){const h=w*555/700;return `<div class="abs" id="${id}" style="width:${w}px;height:${h.toFixed(0)}px"><img src="photos/olivetti_cut.png" style="width:${w}px;height:${h.toFixed(0)}px;display:block">
  <div class="oscr" style="left:${(w*.357).toFixed(1)}px;top:${(h*.0757).toFixed(1)}px;width:${(w*.289).toFixed(1)}px;height:${(h*.27).toFixed(1)}px;font-size:${(w*.05).toFixed(1)}px;padding:${(w*.012).toFixed(1)}px ${(w*.016).toFixed(1)}px">${scr}<div class="scan"></div></div></div>`}
const FLOPPY=`<svg width="250" height="250" viewBox="0 0 250 250"><rect x="2" y="2" width="246" height="246" rx="10" fill="#151515" stroke="#2c2c2c" stroke-width="3"/>
  <circle cx="125" cy="125" r="38" fill="#2a2a2a"/><circle cx="125" cy="125" r="16" fill="#030805"/><rect x="113" y="168" width="24" height="70" rx="12" fill="#030805"/><circle cx="168" cy="110" r="5" fill="#030805"/>
  <rect x="30" y="16" width="190" height="66" rx="4" fill="#F2F2F0"/><line x1="40" y1="44" x2="210" y2="44" stroke="#c9c9c9"/><line x1="40" y1="62" x2="210" y2="62" stroke="#c9c9c9"/>
  <text x="125" y="58" text-anchor="middle" font-family="VT" font-size="40" fill="#C8102E" id="flab">VIENNA</text></svg>`;
const BOSS=`<svg width="150" height="210" viewBox="0 0 150 210"><circle cx="75" cy="52" r="38" fill="#2B3247"/><path d="M8 210 C 10 130, 40 104, 75 104 C 110 104, 140 130, 142 210 Z" fill="#2B3247"/><path d="M75 106 L64 124 L75 186 L86 124 Z" fill="#C8102E"/></svg>`;
const KEYS=`<svg width="220" height="190" viewBox="0 0 220 190"><circle cx="110" cy="34" r="26" fill="none" stroke="#d9d9d9" stroke-width="7"/>
  <g transform="translate(110 58) rotate(-24)"><rect x="-7" y="0" width="14" height="96" rx="4" fill="#E6C25C"/><rect x="-7" y="70" width="30" height="10" fill="#E6C25C"/><rect x="-7" y="86" width="22" height="8" fill="#E6C25C"/><circle cx="0" cy="0" r="16" fill="#E6C25C"/></g>
  <g transform="translate(110 58) rotate(8)"><rect x="-6" y="0" width="12" height="104" rx="4" fill="#cfd4da"/><rect x="-6" y="78" width="26" height="10" fill="#cfd4da"/><rect x="-6" y="94" width="18" height="8" fill="#cfd4da"/><circle cx="0" cy="0" r="15" fill="#cfd4da"/></g>
  <g transform="translate(110 58) rotate(34)"><rect x="-6" y="0" width="12" height="88" rx="4" fill="#b98b5a"/><rect x="-6" y="64" width="24" height="9" fill="#b98b5a"/><circle cx="0" cy="0" r="14" fill="#b98b5a"/></g></svg>`;
const STAR=`<svg width="200" height="190" viewBox="0 0 200 190"><path d="M100 0 L123 70 L198 72 L138 116 L160 188 L100 145 L40 188 L62 116 L2 72 L77 70 Z" fill="#C8102E"/></svg>`;
const PERSON=c=>`<svg width="30" height="40" viewBox="0 0 30 40"><circle cx="15" cy="9" r="8" fill="${c}"/><path d="M1 40 C 2 24, 8 19, 15 19 C 22 19, 28 24, 29 40 Z" fill="${c}"/></svg>`;
const hex=(r,n)=>Array.from({length:n},()=>Math.floor(r()*256).toString(16).toUpperCase().padStart(2,'0'));

/* ------------------------------------------------------------ scény */
const SCN=[
 /* 1 · háček: stovky milionů lidí – a počítač, kterému říkali hračka */
 {id:'hook',from:'s1',cls:'navy',cap:1,
  html:()=>`<div class="abs" style="inset:0;background:radial-gradient(80% 45% at 50% 100%,rgba(255,120,0,.30),transparent 70%)"></div>
   <div class="abs" style="left:74px;top:132px"><span class="badge">POSTAVILI TO <b>ČESKÁ EDICE</b>${FLAG(20)}</span></div>
   <div class="abs mono" style="left:76px;top:186px;font-size:12px;color:var(--g)">CHRÁNÍ UŽIVATELŮ · 2021</div>
   <div class="abs" id="hcnt" style="left:72px;top:204px;font-size:64px;font-weight:900;letter-spacing:-.04em;color:var(--or);font-variant-numeric:tabular-nums">0</div>
   <div class="abs" id="hol" style="left:80px;top:300px;transform-origin:50% 60%">${OLI(380,'holi','<div style="line-height:1.1">C:\\&gt;<span id="hcur">_</span></div>')}</div>
   <div class="abs" id="hst" style="left:122px;top:410px;opacity:0"><span class="stamp" style="font-size:58px">HRAČKA</span></div>`,
  anim:(t,s)=>{$('hcnt').textContent=fmt(lerp(300e6,435e6,eo(t/1.6)));$('hcur').style.visibility=Math.floor(t*2.5)%2?'hidden':'visible';
    const P=ck('s1',3);$('hol').style.transform=`scale(${(1+.025*t+.05*eo((t-P)/.5)).toFixed(4)})`;stampIn($('hst'),t,ck('s1',5)+.33,-9,2)},
  ev:s=>[[0,'hum',ck('s1',5)],[0,'count',1.6],[ck('s1',5)+.33,'stamp',.55],[ck('s1',5)+.33,'shk',7]]},

 /* 2 · rok 1988, VÚMS v Praze, první počítač z Itálie */
 {id:'y1988',from:'s2',cls:'crt',capS:['s3'],year:1988,tr:'glitch',
  html:()=>`<div class="abs vt glow" id="y88" style="left:0;right:0;top:250px;text-align:center;font-size:240px;color:var(--grn);transform-origin:50% 0">1988</div>
   <div class="abs vt" id="y88l" style="left:0;right:0;top:486px;text-align:center;font-size:32px;color:var(--grn);letter-spacing:.12em">PRAHA · VÚMS</div>
   <div class="abs" id="y88o" style="left:120px;top:300px;opacity:0">${OLI(300,'y88oi','<div style="line-height:1.15">OLIVETTI<br>M24 OK</div>')}</div>
   <div class="abs" id="y88c" style="left:0;right:0;top:560px;display:flex;justify-content:center;opacity:0"><span class="chip" style="color:var(--grn);border-color:rgba(59,255,126,.5)">OLIVETTI M24 · ITÁLIE ${FLAG_IT(20)}</span></div>
   <div class="scan"></div>`,
  anim:(t,s)=>{const u=t-s.t0,S=st('s3')-.05,m=eio((t-S)/.4);const y=$('y88');y.style.transform=`translateY(${(-80*m).toFixed(1)}px) scale(${lerp(1,.42,m).toFixed(4)})`;y.style.opacity=(t<s.t0+.08?clamp(u/.08):1)*(1-.45*m);
    y.style.textShadow=rgbSplit(u,.25,7)+(u>.25?'':'');$('y88l').style.opacity=(clamp((u-.25)/.2)*(1-m)).toFixed(3);
    slideX($('y88o'),t,ck('s3',1),380,.5);popIn($('y88c'),t,ck('s3',3)-.05)},
  ev:s=>[[s.t0,'type',.6],[st('s3')-.05,'whoosh'],[ck('s3',1),'swish'],[ck('s3',3)-.05,'pop2']]},

 /* 3 · „To je hračka.“ → skončí na stole Pavla Baudiše */
 {id:'toy',from:'s4',cls:'navy',cap:1,year:1988,tr:'scan',
  html:()=>`<div class="abs" id="tbs" style="left:66px;top:300px">${BOSS}</div>
   <div class="abs" id="tbb" style="left:214px;top:262px;width:256px;opacity:0"><div style="background:#fff;color:#111;border-radius:22px;padding:18px 20px;font-weight:850;font-size:32px;letter-spacing:-.03em;line-height:1.05">To je jen <span id="tbw">hračka.</span></div>
    <svg width="40" height="30" style="position:absolute;left:-18px;top:56px"><path d="M40 0 L0 18 L40 26 Z" fill="#fff"/></svg><div class="mono" style="font-size:11px;color:var(--g);margin-top:10px">VEDENÍ ÚSTAVU</div></div>
   <div class="abs" id="tdk" style="left:0;top:0;width:540px;height:960px;opacity:0">
    <div class="abs" id="tph" style="left:54px;top:272px;width:432px;padding:12px 12px 40px;background:#F4F4F2;box-shadow:0 26px 60px rgba(0,0,0,.55);transform-origin:50% 30%">
     <img src="photos/baudis_young.jpg" style="display:block;width:408px;height:285px">
     <div class="mono" style="position:absolute;left:16px;bottom:13px;font-size:11px;color:#555">PAVEL BAUDIŠ · ARCHIVNÍ FOTO</div></div>
    <div class="card" id="tnc" style="left:74px;top:186px;padding:12px 18px 12px;opacity:0"><div style="font-weight:900;font-size:30px;letter-spacing:-.03em">Pavel Baudiš</div><div class="mono" style="font-size:12px;color:#555;margin-top:4px">28 LET · GRAFIK · VÚMS</div></div></div>`,
  anim:(t,s)=>{const B=s.t0+.2;slideIn($('tbb'),t,B,20,.3);const H=ck('s4',1)+.2;const w=$('tbw');w.style.color=t>=H?'#E5322D':'#111';$('tbb').style.transform+=t>=H&&t<H+.4?` translateX(${(5*Math.sin((t-H)*80)*Math.exp(-(t-H)/.12)).toFixed(2)}px)`:'';
    const D=st('s5')-.05,m=eio((t-D)/.35);$('tbs').style.opacity=(1-m).toFixed(3);$('tbb').style.opacity=t>=B?(e5((t-B)/.3)*(1-m)).toFixed(3):0;
    const dk=$('tdk');dk.style.opacity=m.toFixed(3);const q=e5((t-D)/.5);$('tph').style.transform=`translateY(${(-50*(1-q)).toFixed(1)}px) rotate(${lerp(-7,-2.5,q).toFixed(2)}deg) scale(${(1.04-.04*q+.012*Math.max(0,t-D)).toFixed(4)})`;slideX($('tnc'),t,ck('s5',3),-40,.35)},
  ev:s=>[[s.t0+.2,'pop'],[ck('s4',1)+.2,'scratch'],[st('s5')-.05,'whoosh'],[st('s5')+.3,'paper'],[ck('s5',3),'pop2']]},

 /* 4 · disketa s virem Vienna → rozebrat do posledního bajtu → zničit */
 {id:'virus',from:'s6',cls:'crt',cap:1,year:1988,tr:'glitch',
  html:()=>{const r=rng(88);let rows='';for(let i=0;i<12;i++){const b=hex(r,8);rows+=`<div class="hxr" style="display:flex;gap:9px"><span style="opacity:.55">${(i*8).toString(16).toUpperCase().padStart(4,'0')}:</span>${b.map((x,j)=>`<span class="hb" data-k="${i*8+j}">${x}</span>`).join('')}</div>`}
   return `<div class="abs" id="vfl" style="left:145px;top:250px;opacity:0">${FLOPPY}</div>
   <div class="abs vt" id="vvir" style="left:0;right:0;top:520px;text-align:center;font-size:44px;color:#FF4D5E;opacity:0">⚠ VIRUS · VIENNA</div>
   <div class="abs vt glow" id="vhx" style="left:58px;top:224px;width:424px;font-size:25px;line-height:1.2;color:var(--grn);opacity:0">${rows}</div>
   <div class="abs vt glow" id="vpr" style="left:58px;top:224px;width:424px;font-size:27px;line-height:1.3;color:var(--grn);opacity:0;white-space:pre"></div>
   <div class="abs vt glow" id="vok" style="left:0;right:0;top:450px;text-align:center;font-size:62px;color:var(--grn);opacity:0">✓ VIRUS ODSTRANĚN</div>
   <div class="scan"></div>`},
  anim:(t,s)=>{const F=ck('s6',2)-.1;const fl=$('vfl');const S7=st('s7')-.05,m=eio((t-S7)/.35);
    fl.style.opacity=t>=F?1:0;fl.style.transform=`translate(${(190*m).toFixed(1)}px,${(-110*m+90*(1-e5((t-F)/.4))).toFixed(1)}px) scale(${lerp(1,.34,m).toFixed(4)})`;
    const V=ck('s6',4);const vv=$('vvir');vv.style.opacity=t>=V&&t<S7?1:0;vv.style.textShadow=rgbSplit(t-V,.3,8);$('flab').setAttribute('fill',t>=V&&Math.floor(t*8)%2?'#FF4D5E':'#C8102E');
