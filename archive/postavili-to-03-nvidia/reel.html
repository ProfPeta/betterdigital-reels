<!doctype html>
<!-- POSTAVILI TO #03 – Jensen Huang / Nvidia. TikTok/Reels 540×960 CSS px (render 2×), 30 fps, délka podle hlasu (timeline.js).
     Styl: kostra Better Digital (žlutý odznak, Uzel, titulky) + vlastní „Nvidia“ vrstva: černá, zelená #76B900, technická mřížka, HUD rohy, mono popisky. -->
<html lang="cs"><head><meta charset="utf-8"><title>POSTAVILI TO #03 – Jensen Huang</title>
<style>
@font-face{font-family:IT;src:url(../../engine/fonts/InterTight-Variable.ttf);font-weight:100 900}
@font-face{font-family:JB;src:url(../../engine/fonts/jetbrains-mono-latin-ext-500-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:JB;src:url(../../engine/fonts/jetbrains-mono-latin-500-normal.woff2);unicode-range:U+0000-00FF,U+2013-201E,U+2026,U+2212}
:root{--nv:#76B900;--nvd:#3d6100;--red:#E5322D;--y:#FFD400;--g:#8C939E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:#000}
body{font-family:IT,'Noto Color Emoji',sans-serif;-webkit-font-smoothing:antialiased;position:relative;color:#fff}
.abs{position:absolute}
#stage{position:absolute;left:0;top:0;width:540px;height:960px;z-index:0}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
.cam{position:absolute;inset:0;transform-origin:50% 45%}
.blk{background:#000}.white{background:#fff;color:#111}.ink{background:#07090a}.redd{background:#120303}.nvg{background:radial-gradient(70% 50% at 50% 42%,#14220a,#000 75%)}
/* technická mřížka (Nvidia vrstva) */
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(118,185,0,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(118,185,0,.07) 1px,transparent 1px);background-size:27px 27px;background-position:0 0}
.grid.r{background-image:linear-gradient(rgba(229,50,45,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(229,50,45,.08) 1px,transparent 1px)}
.mono{font-family:JB,monospace;letter-spacing:.08em;white-space:nowrap}
.big{font-weight:900;letter-spacing:-.045em;line-height:.95;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--y);color:#0E0E0E;font-weight:900;font-size:19px;letter-spacing:-.01em;padding:6px 12px 6px;border-radius:6px}
.badge b{font-family:JB;font-size:11px;font-weight:500;letter-spacing:.12em}
/* šikmý štítek */
.tag{display:inline-block;background:var(--nv);color:#000;font-family:JB;font-size:13px;letter-spacing:.1em;padding:5px 16px 4px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);white-space:nowrap}
.tag.w{background:#fff}.tag.r{background:var(--red);color:#fff}.tag.k{background:#111;color:var(--nv)}
.stamp{display:inline-block;font-weight:900;font-size:46px;color:var(--red);border:6px solid var(--red);padding:2px 16px 4px;letter-spacing:.02em;line-height:1.05;white-space:nowrap;border-radius:4px}
.stamp.gr{color:var(--nv);border-color:var(--nv)}
/* HUD rám */
.hud{position:absolute;pointer-events:none}
.hud i{position:absolute;width:18px;height:18px;border-color:var(--nv);border-style:solid}
.hud i:nth-child(1){left:0;top:0;border-width:2.5px 0 0 2.5px}.hud i:nth-child(2){right:0;top:0;border-width:2.5px 2.5px 0 0}
.hud i:nth-child(3){left:0;bottom:0;border-width:0 0 2.5px 2.5px}.hud i:nth-child(4){right:0;bottom:0;border-width:0 2.5px 2.5px 0}
.ph{position:absolute;overflow:hidden;background:#111}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.lbl{position:absolute;left:8px;bottom:7px;font-family:JB;font-size:10px;letter-spacing:.1em;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px}
.card{position:absolute;background:#fff;color:#111;border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
/* titulky */
#cap{position:absolute;left:40px;right:40px;text-align:center;pointer-events:none;z-index:3}
#cap span{display:inline;background:rgba(8,8,8,.86);color:#fff;font-weight:850;font-size:30px;letter-spacing:-.02em;line-height:1.5;padding:4px 12px;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:5px}
#cap b{font-weight:850;background:var(--nv);color:#000;padding:0 6px;border-radius:3px}
/* časová osa */
#tl{position:absolute;left:74px;width:392px;top:122px;height:36px;pointer-events:none;z-index:2}
#tl .ln{position:absolute;left:0;right:0;top:24px;height:1.5px;background:rgba(255,255,255,.3)}
#tl .pg{position:absolute;left:0;top:24px;height:1.5px;background:var(--nv)}
#tl .ev{position:absolute;top:20px;width:9px;height:9px;margin-left:-4.5px;border:1.5px solid rgba(255,255,255,.55);background:#000;transform:rotate(45deg)}
#tl .ev.p{background:var(--nv);border-color:var(--nv)}
#tl .cur{position:absolute;top:17px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(118,185,0,.75),0 0 16px rgba(118,185,0,.9)}
#tl .yr{position:absolute;top:0;transform:translateX(-50%);font-family:JB;font-size:13px;letter-spacing:.1em;color:#fff;white-space:nowrap}
#gl{position:absolute;inset:0;pointer-events:none;z-index:4}
#scanl{position:absolute;left:0;width:540px;height:3px;background:var(--nv);box-shadow:0 0 18px 5px rgba(118,185,0,.85);display:none;pointer-events:none;z-index:4}
#grain{position:absolute;left:0;top:0;width:540px;height:960px;pointer-events:none;z-index:5}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
</style></head><body>
<div id="stage"></div>
<div id="tl"></div>
<div id="cap"></div>
<div id="gl"></div><div id="scanl"></div>
<canvas id="grain" width="180" height="320"></canvas>
<div id="flash"></div>
<script src="timeline.js"></script>
<script>
const FPS=30;const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3),e5=x=>1-Math.pow(1-clamp(x),5);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;const $=id=>document.getElementById(id);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function uzel(h,col){const w=h*3.8,sw=h*.12,r=h/2-sw/2;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;display:block"><circle cx="${h/2}" cy="${h/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/><line x1="${h}" y1="${h/2}" x2="${w-h}" y2="${h/2}" stroke="${col}" stroke-width="${sw}"/><circle cx="${w-h/2}" cy="${h/2}" r="${h/2}" fill="#FFD400"/></svg>`}
const T=window.TL;const st=s=>T.S[s][0],en=s=>T.S[s][1];
const CK={};T.chunks.forEach(([s,i,txt,a,b])=>{(CK[s]=CK[s]||[])[i]=[a,b,txt]});
const ck=(s,i)=>CK[s][i][0];
window.DURATION=T.END;
function slamT(u,s0=1.35,amp=7){const p=e5(u/.1),k=Math.exp(-Math.max(0,u)/.13);
  return `translate(${(amp*k*Math.sin(u*97+1.1)).toFixed(2)}px,${(amp*.7*k*Math.sin(u*83+.3)).toFixed(2)}px) scale(${lerp(s0,1,p).toFixed(4)})`}
const popIn=(e,t,a,d=.22,s0=.6)=>{e.style.opacity=t>=a?1:0;e.style.transform=`scale(${lerp(s0,1,back((t-a)/d)).toFixed(4)})`};
const slideIn=(e,t,a,dy=24,d=.3)=>{const p=e5((t-a)/d);e.style.opacity=t>=a?p:0;e.style.transform=`translateY(${(dy*(1-p)).toFixed(1)}px)`};
const slideX=(e,t,a,dx=60,d=.35)=>{const p=e5((t-a)/d);e.style.opacity=t>=a?p:0;e.style.transform=`translateX(${(dx*(1-p)).toFixed(1)}px)`};
const stampIn=(e,t,a,rot=-8,s0=1.8)=>{e.style.opacity=t>=a?1:0;if(t>=a)e.style.transform=`rotate(${rot}deg) `+slamT(t-a,s0,6)};
const fade=(e,t,a,d=.25)=>{e.style.opacity=clamp((t-a)/d).toFixed(3)};
const typeTo=(e,txt,t,a,cps=22)=>{const n=Math.max(0,Math.floor((t-a)*cps));e.textContent=t>=a?txt.slice(0,n):''};
const HUD=`<div class="hud" style="inset:-8px"><i></i><i></i><i></i><i></i></div>`;
const PERSON=(c,w=24)=>`<svg width="${w}" height="${w*1.25}" viewBox="0 0 30 38"><circle cx="15" cy="9" r="8" fill="${c}"/><path d="M1 38 C 2 23, 8 19, 15 19 C 22 19, 28 23, 29 38 Z" fill="${c}"/></svg>`;

/* ------------------------------------------------------------ prvky */
const BRUSH=`<svg width="120" height="170" viewBox="0 0 120 170"><rect x="54" y="4" width="12" height="104" rx="6" fill="#d9d9d9"/><rect x="50" y="2" width="20" height="14" rx="6" fill="#76B900"/>
  <ellipse cx="60" cy="132" rx="34" ry="30" fill="#f2f2f2"/>${Array.from({length:22},(_,i)=>{const a=i/22*Math.PI*2;return `<line x1="${60+22*Math.cos(a)}" y1="${132+20*Math.sin(a)}" x2="${60+38*Math.cos(a)}" y2="${132+34*Math.sin(a)}" stroke="#cfcfcf" stroke-width="4" stroke-linecap="round"/>`}).join('')}</svg>`;
const PLATE=(w=150)=>`<svg width="${w}" height="${w*.22}" viewBox="0 0 150 33"><ellipse cx="75" cy="16" rx="73" ry="15" fill="#f4f4f1" stroke="#c9c9c2" stroke-width="2"/><ellipse cx="75" cy="15" rx="46" ry="8" fill="none" stroke="#dcdcd6" stroke-width="2"/></svg>`;
const CHIP=(lab,c='#76B900',w=210)=>`<svg width="${w}" height="${w}" viewBox="0 0 210 210">${Array.from({length:8},(_,i)=>{const p=34+i*20;return `<rect x="${p}" y="0" width="7" height="22" fill="#9aa0a6"/><rect x="${p}" y="188" width="7" height="22" fill="#9aa0a6"/><rect x="0" y="${p}" width="22" height="7" fill="#9aa0a6"/><rect x="188" y="${p}" width="22" height="7" fill="#9aa0a6"/>`}).join('')}
  <rect x="20" y="20" width="170" height="170" rx="10" fill="#15181b" stroke="${c}" stroke-width="3"/><rect x="48" y="48" width="114" height="114" rx="4" fill="#1d2226" stroke="#2c3338" stroke-width="2"/>
  <text x="105" y="114" text-anchor="middle" font-family="JB" font-size="30" fill="#fff" letter-spacing="2">${lab}</text></svg>`;
const QUADS=`<svg width="150" height="110" viewBox="0 0 150 110">${Array.from({length:4},(_,r)=>Array.from({length:5},(_,c)=>`<path d="M${10+c*26+r*4} ${10+r*24} q 13 ${-6+r*2} 26 0 l 0 24 q -13 ${4} -26 0 z" fill="none" stroke="#E5322D" stroke-width="2"/>`).join('')).join('')}</svg>`;
const TRIS=`<svg width="150" height="110" viewBox="0 0 150 110">${Array.from({length:4},(_,r)=>Array.from({length:5},(_,c)=>{const x=10+c*26,y=10+r*24;return `<path d="M${x} ${y} L${x+26} ${y} L${x} ${y+24} Z M${x+26} ${y} L${x+26} ${y+24} L${x} ${y+24} Z" fill="none" stroke="#76B900" stroke-width="2"/>`}).join('')).join('')}</svg>`;
const PLANE=`<svg width="34" height="34" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="#fff"/></svg>`;
const BOOTH=`<svg width="392" height="230" viewBox="0 0 392 230"><path d="M30 40 Q30 20 50 20 L342 20 Q362 20 362 40 L362 120 L30 120 Z" fill="#7a1f1f"/><path d="M30 40 L362 40" stroke="#5c1414" stroke-width="3"/>
  ${[80,150,220,290].map(x=>`<line x1="${x}" y1="24" x2="${x}" y2="118" stroke="#5c1414" stroke-width="2"/>`).join('')}<rect x="60" y="112" width="272" height="20" rx="4" fill="#d9c9a3"/><rect x="186" y="132" width="20" height="90" fill="#555"/><rect x="146" y="214" width="100" height="10" rx="3" fill="#444"/></svg>`;

/* ------------------------------------------------------------ scény */
const SCN=[
 /* 1 · háček: dnes CEO Nvidie, v 9 letech drhnul záchody */
 {id:'hook',from:'s1',cls:'blk',cap:1,
  html:()=>`<div class="grid"></div><div class="abs" style="inset:0;background:radial-gradient(60% 40% at 50% 40%,rgba(118,185,0,.16),transparent 70%)"></div>
   <div class="abs" style="left:74px;top:132px"><span class="badge">POSTAVILI TO <b>#03 · JENSEN HUANG</b></span></div>
   <div class="ph" id="hph" style="left:74px;top:186px;width:392px;height:290px"><img src="photos/huang_bw.jpg" style="object-position:50% 30%"><div class="lbl">JENSEN HUANG · DNES CEO NVIDIE</div></div>
   <div class="hud" id="hhud" style="left:66px;top:178px;width:408px;height:306px;opacity:0"><i></i><i></i><i></i><i></i></div>
   <div class="abs" id="hage" style="left:74px;top:494px;opacity:0;transform-origin:0 50%"><div style="display:flex;align-items:baseline;gap:10px"><span class="big" style="font-size:104px;color:var(--nv)">9</span><span class="big" style="font-size:44px">LET</span></div></div>
   <div class="abs" id="hbr" style="left:330px;top:484px;opacity:0;transform-origin:60px 100px">${BRUSH}</div>
   <div class="abs" id="hst" style="left:74px;top:610px;opacity:0"><span class="tag r" style="font-size:14px">ÚKOL: ZÁCHODY · KAŽDÝ DEN</span></div>`,
  anim:(t,s)=>{const u=t-s.t0;const ph=$('hph');ph.style.transform=`scale(${(1.06-.06*e5(u/.6)).toFixed(4)})`;ph.style.opacity=clamp(u/.15);
    const hd=$('hhud');hd.style.opacity=clamp((u-.15)/.2);hd.style.transform=`scale(${(1.06-.06*e5((u-.15)/.4)).toFixed(4)})`;
    const A=ck('s1',1)+.05;const a=$('hage');a.style.opacity=t>=A?1:0;if(t>=A)a.style.transform=slamT(t-A,1.5,6);
    const B=ck('s1',3);const b=$('hbr');b.style.opacity=t>=B?1:0;if(t>=B)b.style.transform=`rotate(${(14*Math.sin((t-B)*16)*Math.exp(-(t-B)*2.2)).toFixed(2)}deg) `+slamT(t-B,1.4,5);
    slideX($('hst'),t,B+.2,30,.3)},
  ev:s=>[[0,'slam',.3],[.15,'hud'],[ck('s1',1)+.05,'slam',.4],[ck('s1',3),'scrub'],[ck('s1',3)+.2,'pop']]},

 /* 2 · rodiče ho poslali z Tchaj-wanu do Ameriky */
 {id:'fly',from:'s2',cls:'ink',cap:1,tr:'scan',
  html:()=>`<div class="grid"></div>
   <div class="abs mono" style="left:74px;top:186px;font-size:13px;color:var(--g)">BEZ RODIČŮ · SE STARŠÍM BRATREM</div>
   <svg class="abs" width="540" height="420" style="left:0;top:210px"><path id="farc" d="M 420 300 Q 270 40 110 230" fill="none" stroke="rgba(118,185,0,.25)" stroke-width="2" stroke-dasharray="6 7"/><path id="farc2" d="M 420 300 Q 270 40 110 230" fill="none" stroke="#76B900" stroke-width="3"/>
    <circle cx="420" cy="300" r="7" fill="#fff"/><circle cx="420" cy="300" r="16" fill="none" stroke="#fff" stroke-opacity=".4"/><circle id="fdst" cx="110" cy="230" r="7" fill="#76B900"/></svg>
   <div class="abs" id="fpl" style="left:0;top:0;opacity:0">${PLANE}</div>
   <div class="abs" id="ft1" style="left:330px;top:540px;opacity:0"><span class="tag w">TCHAJ-WAN</span></div>
   <div class="abs" id="ft2" style="left:74px;top:470px;opacity:0"><span class="tag">USA</span></div>
   <div class="abs big" id="fage" style="left:300px;top:270px;font-size:58px;color:#fff;opacity:0">9 let</div>`,
  anim:(t,s)=>{const P=$('farc2');const L=P.getTotalLength();const A=ck('s2',1)-.1,B=ck('s2',2)+.35;const p=eio((t-A)/(B-A));
    P.style.strokeDasharray=L;P.style.strokeDashoffset=(L*(1-p)).toFixed(1);slideIn($('ft1'),t,A-.25,16,.25);
    const pt=P.getPointAtLength(L*p),pt2=P.getPointAtLength(Math.min(L,L*p+2));const ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI+90;
    const pl=$('fpl');pl.style.opacity=t>=A&&p<1?1:0;pl.style.transform=`translate(${(pt.x-17).toFixed(1)}px,${(pt.y+210-17).toFixed(1)}px) rotate(${ang.toFixed(1)}deg)`;
    popIn($('ft2'),t,B-.05,.25,.6);fade($('fage'),t,s.t0+.2,.3)},
  ev:s=>[[ck('s2',1)-.1,'jet',ck('s2',2)+.45-ck('s2',1)],[ck('s2',2)+.3,'pop2']]},

 /* 3 · strýc ho omylem zapsal do polepšovny v Kentucky; byl nejmladší, dostal záchody */
 {id:'oneida',from:'s3',cls:'ink',cap:1,tr:'flash',
  html:()=>`<div class="grid"></div>
   <div class="ph" id="oph" style="left:74px;top:200px;width:392px;height:262px"><img src="photos/oneida.jpg"><div class="lbl">ONEIDA BAPTIST INSTITUTE · KENTUCKY</div></div>
   <div class="abs" id="ost" style="left:150px;top:300px;opacity:0"><span class="stamp" style="background:rgba(0,0,0,.72)">POLEPŠOVNA</span></div>
   <div class="abs" id="oerr" style="left:74px;top:160px;opacity:0"><span class="tag r">OMYL: MYSLELI, ŽE JE TO ELITNÍ ŠKOLA</span></div>
   <div class="abs" id="orow" style="left:74px;top:486px;width:392px;display:flex;align-items:flex-end;gap:10px">${[54,50,46,42,38,34,26].map((h,i)=>`<div class="orp" data-i="${i}" style="opacity:0">${PERSON(i===6?'#76B900':'#3a3f45',h*.62)}</div>`).join('')}</div>
   <div class="abs" id="oyou" style="left:368px;top:466px;opacity:0"><span class="tag" style="font-size:11px">NEJMLADŠÍ</span></div>
   <div class="card" id="oduty" style="left:74px;top:560px;width:392px;padding:10px 16px;opacity:0;display:flex;justify-content:space-between;align-items:center;border-radius:4px">
    <div><div class="mono" style="font-size:11px;color:#666">ROZPIS SLUŽEB</div><div style="font-weight:900;font-size:24px;letter-spacing:-.03em">Záchody · <span style="color:var(--red)">každý den</span></div></div><div style="font-weight:900;font-size:32px;color:var(--nv)">✓</div></div>`,
  anim:(t,s)=>{const u=t-s.t0;$('oph').style.transform=`scale(${(1.08-.08*e5(u/.8)).toFixed(4)})`;slideX($('oerr'),t,ck('s3',0)+.25,-30,.3);
    stampIn($('ost'),t,ck('s3',1)+.45,-7,1.9);if(t>=st('s4')-.1)$('ost').style.opacity=(1-clamp((t-st('s4')+.1)/.2)).toFixed(3);
    const R=st('s4')-.05;s.el.querySelectorAll('.orp').forEach(e=>{const i=+e.dataset.i;popIn(e,t,R+i*.07,.2,.4)});popIn($('oyou'),t,R+.6,.22,.6);slideIn($('oduty'),t,ck('s4',1)+.1,30,.3)},
  ev:s=>[[ck('s3',0)+.25,'swish'],[ck('s3',1)+.45,'stamp',.4],...[0,1,2,3,4,5,6].map(i=>[st('s4')-.05+i*.07,'tick2']),[st('s4')+.55,'pop2'],[ck('s4',1)+.1,'paper'],[ck('s4',1)+.4,'scrub']]},

 /* 4 · jako teenager myl nádobí v Denny's */
 {id:'dennys',from:'s5',cls:'blk',cap:1,year:1978,tr:'glitch',
  html:()=>`<div class="grid"></div>
   <div class="ph" id="dph" style="left:74px;top:186px;width:220px;height:300px"><img src="photos/dennys.jpg"><div class="lbl">DENNY'S · ILUSTRAČNÍ FOTO</div></div>
   <div class="abs" style="left:310px;top:186px"><span class="tag w">PRVNÍ PRÁCE</span></div>
   <div class="abs" id="dpl" style="left:310px;top:250px;width:160px;height:240px">${Array.from({length:10},(_,i)=>`<div class="abs dp" data-i="${i}" style="left:5px;top:${200-i*15}px;opacity:0">${PLATE(150)}</div>`).join('')}</div>
