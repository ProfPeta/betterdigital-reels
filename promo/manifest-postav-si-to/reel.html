function torn(seed,w,h,j=7,step=9){const r=rng(seed);const pts=[];
  const edge=(x0,y0,x1,y1,nx,ny)=>{const L=Math.hypot(x1-x0,y1-y0);const n=Math.max(2,Math.round(L/step));

  return 'polygon('+pts.map(([x,y])=>`${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',')+')'}
function dust(seed,col='#111'){const r=rng(seed);let s=`<svg class="dust" width="540" height="960">`;

 B3:(u,s)=>{s.el.querySelector('.ubar').style.transform=`scaleX(${e5((u-VT.b3s-.3)/.22).toFixed(4)})`},
 C2:(u,s,d)=>{const m=60+120*eio(clamp(u/(d-.2)));s.el.querySelector('.clk').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0')},
 P3:(u,s,d)=>{s.el.querySelector('.cnt').textContent='Den '+fmt(Math.max(1,Math.round(1000*eo(u/(d*.8)))))},
 P4:(u,s,d)=>{s.cam.style.transform=`scale(${(1+.12*eio(u/d)).toFixed(4)})`},
 V1:(u,s)=>{const ed=s.el.querySelectorAll('.ed'),dt=s.el.querySelectorAll('.dt');
   EDGES.forEach(([a,b],i)=>{const at=NODES[b][3];ed[i].style.strokeDashoffset=(1-e5((u-at+.05)/.22)).toFixed(4);
     const on=u>at+.2;const q=((u-at)*1.25+i*.37)%1;dt[i].setAttribute('cx',lerp(NODES[a][1],NODES[b][1],q).toFixed(1));
     dt[i].setAttribute('cy',lerp(NODES[a][2],NODES[b][2],q).toFixed(1));dt[i].setAttribute('opacity',on?1:0)})},
 V2:(u,s)=>{s.el.querySelector('.spc').style.letterSpacing=lerp(.46,.3,eo(u/.6)).toFixed(4)+'em'},
 V3:(u,s)=>{const c=s.el.querySelector('.cur i');c.style.opacity=(Math.floor((u-.85)/.3)%2===0)?1:0},
 Y5:(u,s)=>{s.el.querySelector('.strike>i').style.transform=`scaleX(${e5((u-.28)/.22).toFixed(4)})`},
 Y8:(u,s,d)=>{const p=eio(clamp((u-.15)/(d-.3)));s.el.querySelector('.pb i').style.transform=`scaleX(${p.toFixed(4)})`;
   s.el.querySelector('.pl').textContent=(p>=1?'Hotovo · ':'Stavím… ')+Math.round(p*100)+' %'},
 Y9:(u,s)=>{s.el.querySelector('.rg').setAttribute('transform',`rotate(${(u*14).toFixed(2)} 270 435)`)},
 E2:(u,s)=>{const ch=Array.from(TYPED);const k=clamp(Math.floor((u-TY0)*TYC)+1,0,ch.length);
   s.el.querySelector('.ty').textContent=ch.slice(0,k).join('');s.el.querySelector('.ph').style.display=k>0?'none':'inline';
   const done=k>=ch.length;s.el.querySelector('.ca').style.opacity=(!done||Math.floor(u*2.4)%2===0)?1:0;
   const b=s.el.querySelector('.snd');b.style.background=done?'#FFD400':'#333';b.style.color=done?'#0B0B0B':'#888'}};

/* ------------------------------------------------------------ sestavení */
const stage=$('stage');const SC=S.map(([id,cls,t0,t1])=>{const el=document.createElement('div');el.className='sc '+cls;el.id=id;
  el.innerHTML=`<div class="cam">${P[id]()}</div>`;stage.appendChild(el);
  return {id,el,t0,t1,cam:el.querySelector('.cam'),ats:[...el.querySelectorAll('[data-at]')],wipes:[...el.querySelectorAll('[data-wipe]')],drifts:[...el.querySelectorAll('[data-drift]')]}});
function initScenes(){SC.forEach(s=>{s.el.style.display='block';fitAll(s.el);
  if(s.id==='H4'){const m=s.el.querySelector('.main'),fs=parseFloat(m.style.fontSize);let h='';
    for(let k=-4;k<=4;k++)if(k)h+=`<div class="bw abs ech" data-k="${k}" style="left:0;right:0;text-align:center;font-size:${fs}px;-webkit-text-stroke:1.3px #FFD400;color:transparent">NAŠTVANÍ.</div>`;
    s.el.querySelector('.echoes').innerHTML=h}
  s.el.style.display='none'})}
const GC=$('grain').getContext('2d'),GI=GC.createImageData(180,320);
function grain(f){const r=rng(9000+f),d=GI.data;for(let i=0;i<d.length;i+=4){const v=r()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=20}GC.putImageData(GI,0,0)}
let CUR=null;
window.render=function(t){
  let s=SC[SC.length-1];for(const x of SC)if(t<x.t1){s=x;break}
  if(CUR!==s){if(CUR)CUR.el.style.display='none';s.el.style.display='block';CUR=s}
  const u=t-s.t0,d=s.t1-s.t0;
  s.cam.style.transform=`scale(${(1+.035*u/d).toFixed(4)})`;
  for(const e of s.ats){const at=+e.dataset.at,on=u>=at;e.style.opacity=on?1:0;
    const base=e.dataset.base||'';let m='';
    if(on)m=e.dataset.slam!==undefined?slamFx(e,u-at):popFx(e,u-at);
    e.style.transform=(m+' '+base).trim()}
  for(const e of s.el.querySelectorAll('[data-slam]'))if(e.dataset.at===undefined){const st=+e.dataset.slam,on=u>=st;e.style.opacity=on?1:0;e.style.transform=on?slamFx(e,u-st):''}
  for(const e of s.wipes)e.firstElementChild.style.transform=`scaleX(${e5((u-(+e.dataset.wipe))/.16).toFixed(4)})`;
  for(const e of s.drifts){const [vx,vy]=e.dataset.drift.split(',').map(Number);e.style.transform=`translate(${(vx*u).toFixed(2)}px,${(vy*u).toFixed(2)}px) ${e.dataset.base||''}`}
  if(AN[s.id])AN[s.id](u,s,d);
  let f=0;for(const [ft,a] of FLASH)if(t>=ft)f=Math.max(f,a*Math.exp(-(t-ft)/.07));$('flash').style.opacity=f.toFixed(3);
  grain(Math.floor(t*FPS+1e-6));
};
const FONTS=['900 20px IT','850 20px IT','800 20px IT','750 20px IT','500 20px IT','400 20px IT','20px JB'];
Promise.all(FONTS.map(f=>document.fonts.load(f,'ěščřžýáíéúůĚŠČŘŽÜüĎŤŇ„“…·№✂🧮🍳👇😤🇨🇿')))
 .then(()=>document.fonts.ready).then(()=>{initScenes();window.READY=true;render(0)});
</script></body></html>
