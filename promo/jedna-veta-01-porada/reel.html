<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>JEDNA VĚTA #01 – Kalkulačka porad</title>
<style>
@font-face{font-family:IT;src:url(../../engine/fonts/InterTight-Variable.ttf);font-weight:100 900}
@font-face{font-family:JB;src:url(../../engine/fonts/jetbrains-mono-latin-ext-500-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:JB;src:url(../../engine/fonts/jetbrains-mono-latin-500-normal.woff2);unicode-range:U+0000-00FF,U+2013-201E,U+2026,U+2212}
:root{--y:#FFD400;--k:#0B0B0B;--g:#8C8C8C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:#fff}

#stage{position:absolute;left:0;top:0;width:540px;height:960px;z-index:0}

.fg{position:absolute;inset:0;display:none}
#emb{position:absolute;left:0;top:0;width:540px;height:960px;z-index:1;pointer-events:none}

  box-shadow:0 0 0 2px #2b2b30 inset,0 34px 80px rgba(0,0,0,.30)}

.chip{display:inline-flex;align-items:center;gap:8px;background:var(--k);color:var(--y);font-family:JB;font-size:13px;letter-spacing:.12em;padding:7px 12px 6px;border-radius:7px;white-space:nowrap}

/* editor */
.ed{position:absolute;left:46px;top:194px;width:448px;height:420px;background:#141414;border:1px solid #2a2a2a;border-radius:16px;overflow:hidden;transform-origin:50% 40%}
.ed .tb{height:36px;border-bottom:1px solid #262626;display:flex;align-items:center;gap:7px;padding:0 14px}
.ed .tb i{width:10px;height:10px;border-radius:50%;background:#3a3a3a;display:block}
.ed .tb span{margin-left:10px;font-family:JB;font-size:12px;color:#d6d6d6;background:#1d1d1d;border:1px solid #2c2c2c;border-bottom:0;padding:6px 12px;border-radius:7px 7px 0 0;margin-top:10px}
.ed .code{position:absolute;left:0;right:0;top:44px;bottom:30px;overflow:hidden}
.ed .ln{height:16px;display:flex;font-family:JB;font-size:11px;line-height:16px;white-space:pre;color:#e8e8e8}

.ed .ln.cur{background:#1f1f1f;box-shadow:inset 3px 0 0 var(--y)}
.ed .sb{position:absolute;left:0;right:0;bottom:0;height:30px;border-top:1px solid #262626;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:JB;font-size:11px;color:#9a9a9a}
.k{color:#FFD400}.s{color:#9FE0A8}.n{color:#FF9E64}.c{color:#6b6b6b}.p{color:#8EC8FF}
.pal{position:absolute;right:16px;top:52px;background:#1d1d1d;border:1px solid #333;border-radius:12px;padding:10px 12px 9px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.pal .t{font-family:JB;font-size:10px;letter-spacing:.14em;color:#9a9a9a;text-transform:uppercase}

</style></head><body>
<div id="stage"></div>
<canvas id="emb" width="1080" height="1920"></canvas>
<div id="phone"><div class="scr"><img id="appimg" alt=""></div></div>
<div id="over"></div>
<div id="tap"></div>
<div id="cap"></div>
<div id="flash"></div>
<script src="timeline.js"></script>
<script src="app_data.js"></script>
<script>
const FPS=30;const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3),e5=x=>1-Math.pow(1-clamp(x),5);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;const $=id=>document.getElementById(id);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function uzel(h,col){const w=h*3.8,sw=h*.12,r=h/2-sw/2;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;display:block"><circle cx="${h/2}" cy="${h/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/><line x1="${h}" y1="${h/2}" x2="${w-h}" y2="${h/2}" stroke="${col}" stroke-width="${sw}"/><circle cx="${w-h/2}" cy="${h/2}" r="${h/2}" fill="#FFD400"/></svg>`}
const T=window.TL,A=window.APP;const st=s=>T.S[s][0],en=s=>T.S[s][1];
const CK={};T.chunks.forEach(([s,i,txt,a,b])=>{(CK[s]=CK[s]||[])[i]=[a,b,txt]});
const ck=(s,i)=>CK[s][i][0],cke=(s,i)=>CK[s][i][1];
window.DURATION=T.END;

/* ------------------------------------------------------------ časy */
const HOOK_END=st('s3')-.06,PROMPT_END=st('s5')-.06,BUILD_END=st('s6')-.06,ZERO_END=st('s7')-.06,DEMO_END=st('s10')-.06,SHARE_END=st('s11')-.06,END=T.END;
const V0=A.v0,GO=A.go,FF0=A.ff0,FF1=A.ff1,HOOK_V=FF1-.25;
const CODE0=st('s5')+.12,CODE1=ck('s5',2)+.55,DONE=CODE1+.1,PAL=ck('s5',1)+.05;
const SEND=en('s4')+.06;
const ZSLAM=ck('s6',1)+.02,DARK=GO+.08;
const PLANE=ck('s10',2)+.05;
const LINES=A.code.split('\n');if(LINES[LINES.length-1]==='')LINES.pop();
const NL=LINES.length;
const PROMPT=A.prompt,WORDS=PROMPT.split(/\s+/).length,CHARS=[...PROMPT].length;
/* psaní zadání: kousky věty s4 se píšou v čase, kdy je hlas říká */
const TYPE=[];{let pos=0;CK.s4.forEach(([a,b,txt],i)=>{const s=txt+(i<CK.s4.length-1?' ':'');const n=[...s].length;for(let j=0;j<n;j++)TYPE.push(a+.04+(b-a)*.9*j/n);pos+=n});}
const typed=t=>{let k=0;while(k<TYPE.length&&TYPE[k]<=t)k++;return [...PROMPT].slice(0,k).join('')};

/* ------------------------------------------------------------ zvýraznění kódu (jednoduché, pro vizuál) */
const KW=new Set(['const','let','var','function','return','if','else','for','of','new','true','false','null','document','state']);
function hl(line){
  const re=/(\/\*.*?\*\/|\/\/.*$)|("[^"]*"|'[^']*'|`[^`]*`)|(<\/?[a-zA-Z][a-zA-Z0-9-]*|\/?>)|(#[0-9a-fA-F]{3,6}\b|\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$-]*)(?=\s*[:=(])|([A-Za-z_$][\w$-]*)|(\s+|.)/g;
  let out='',m;while((m=re.exec(line))){const [x,c,s,tg,n,pk,id]=m;
    if(c)out+=`<span class="c">${esc(c)}</span>`;else if(s)out+=`<span class="s">${esc(s)}</span>`;else if(tg)out+=`<span class="k">${esc(tg)}</span>`;
    else if(n)out+=`<span class="n">${esc(n)}</span>`;else if(pk)out+=KW.has(pk)?`<span class="k">${esc(pk)}</span>`:`<span class="p">${esc(pk)}</span>`;
    else if(id)out+=KW.has(id)?`<span class="k">${esc(id)}</span>`:esc(id);else out+=esc(x)}
  return out}
const HL=LINES.map(hl);
const PALETTE=[...A.code.matchAll(/--(bg|card|fire|fire2|text):\s*(#[0-9a-fA-F]{6})/g)].map(m=>[m[1],m[2]]);

/* ------------------------------------------------------------ telefon s nahrávkou aplikace */
const PH=418,PV=872,BZ=14,L=A.layout;
const ctr=k=>[L[k][0]+L[k][2]/2,L[k][1]+L[k][3]/2];
const [CX,CY]=ctr('cost');
const place=(s,sx,sy,ax,ay)=>({x:sx-(BZ+ax)*s,y:sy-(BZ+ay)*s,s});
const centered=(s,top)=>({x:270-PH*s/2,y:top,s});
function phoneAt(t){
  if(t<HOOK_END){const p=e5(t/.42);return {on:1,...centered(.6,392+34*(1-p)),rot:-4+1.5*p,v:HOOK_V+t}}
  if(t>=V0&&t<BUILD_END){const s=lerp(.40,.52,back((t-V0)/.34));const c=200+PV*.52/2;return {on:1,x:270-PH*s/2,y:c-PV*s/2,s,rot:0,v:t,op:clamp((t-V0)/.12)}}
  if(t>=ZERO_END&&t<SHARE_END){
    const a=centered(.62,205),z=place(.95,270,422,CX,CY),w=place(.95,270,492,CX,CY);
    let q=a;const p1=eio((t-FF0)/.6);if(t>=FF0)q={x:lerp(a.x,z.x,p1),y:lerp(a.y,z.y,p1),s:lerp(a.s,z.s,p1)};
    if(t>=DEMO_END){const p2=eio((t-DEMO_END)/.45);q={x:lerp(z.x,w.x,p2),y:lerp(z.y,w.y,p2),s:z.s}}
    const pin=t<ZERO_END+.4?e5((t-ZERO_END)/.4):1;
    return {on:1,x:q.x,y:q.y+40*(1-pin),s:q.s,rot:0,v:t,op:pin}}
  return {on:0}}
const toStage=(ph,ax,ay)=>[ph.x+(BZ+ax)*ph.s,ph.y+(BZ+ay)*ph.s];
let curIdx=-1;
async function setFrame(v){const i=clamp(Math.round((v-V0)*A.fps),0,A.frames-1);if(i===curIdx)return;const img=$('appimg');img.src=`app_frames/f${String(i).padStart(4,'0')}.jpg`;await img.decode();curIdx=i}

/* ------------------------------------------------------------ scény */
const SCN=[
 /* 1 · háček: výsledek hned v prvním snímku */
 {id:'hook',t0:0,t1:HOOK_END,bg:'#FFD400',
  fg:()=>`<div class="abs" style="left:74px;top:132px"><span class="chip">JEDNA VĚTA · #01</span></div>
   <div class="abs" id="h1" style="left:74px;top:174px;font-size:62px;font-weight:850;letter-spacing:-.045em;line-height:1">Jedna věta.</div>
   <div class="abs" id="h2" style="left:74px;top:246px;transform-origin:0 50%"><div style="display:inline-block;background:var(--k);color:#fff;font-size:58px;font-weight:850;letter-spacing:-.045em;line-height:1.04;padding:4px 14px 8px;border-radius:8px">Hotová<br>aplikace.</div></div>`,
  anim:(t)=>{const a=st('s2');const h2=$('h2');h2.style.opacity=t>=a-.02?1:0;const u=t-a;
    h2.style.transform=u>=0?`scale(${lerp(1.25,1,e5(u/.16)).toFixed(4)}) translate(${(5*Math.exp(-u/.1)*Math.sin(u*90)).toFixed(2)}px,0)`:'none'},
  ev:()=>[[0,'hit'],[st('s2')-.02,'slam']]},

 /* 2 · zadání: jediná věta se píše do pole, jak ji hlas čte */
 {id:'prompt',t0:HOOK_END,t1:PROMPT_END,bg:'#fff',flash:1,
  fg:()=>`<div class="abs" id="p1" style="left:74px;top:136px;font-size:28px;font-weight:700;color:var(--g);letter-spacing:-.02em">Napsali jsme AI</div>
   <div class="abs" id="p2" style="left:74px;top:172px;font-size:58px;font-weight:850;letter-spacing:-.045em;line-height:1"><span style="background:linear-gradient(transparent 58%,var(--y) 58%,var(--y) 92%,transparent 92%);padding:0 2px">jediné</span> zadání:</div>
   <div class="abs" id="pbox" style="left:74px;top:280px;width:392px;height:268px;border:2.5px solid var(--k);border-radius:22px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.08)">
     <div class="mono" style="position:absolute;left:20px;top:16px;font-size:11px;color:var(--g);letter-spacing:.14em">ZADÁNÍ PRO AI</div>
     <div id="ptx" style="position:absolute;left:20px;right:20px;top:42px;font-size:28px;font-weight:650;line-height:1.3;letter-spacing:-.015em"></div>
     <div id="psend" style="position:absolute;right:14px;bottom:14px;width:50px;height:50px;border-radius:50%;background:#d9d9d9;display:flex;align-items:center;justify-content:center">
       <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 18V4M4.5 10.5 11 4l6.5 6.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
   <div class="abs mono" id="pmeta" style="left:74px;top:566px;font-size:14px;color:var(--k)">1 věta · ${WORDS} slov · ${CHARS} znaků</div>`,
  anim:(t)=>{const a=ck('s3',0),b=ck('s3',1);
    const p1=$('p1'),p2=$('p2');p1.style.opacity=e5((t-a+.1)/.25);p1.style.transform=`translateY(${(14*(1-e5((t-a+.1)/.25))).toFixed(1)}px)`;
    p2.style.opacity=t>=b-.03?1:0;p2.style.transform=t>=b-.03?`scale(${lerp(1.12,1,e5((t-b+.03)/.18)).toFixed(4)})`:'none';p2.style.transformOrigin='0 50%';
    const bx=$('pbox');const ip=e5((t-HOOK_END-.15)/.4);bx.style.opacity=ip;let ty=30*(1-ip);
    const tx=typed(t);const blink=(TYPE.length&&t<TYPE[0])||t>TYPE[TYPE.length-1]+.05?(Math.floor(t*2.6)%2===0):true;
    $('ptx').innerHTML=esc(tx)+`<span style="display:inline-block;width:3px;height:30px;background:var(--k);vertical-align:-5px;margin-left:2px;visibility:${blink&&t<SEND?'visible':'hidden'}"></span>`;
    const full=tx.length>=PROMPT.length;const sd=$('psend');sd.style.background=t>=SEND?'#FFD400':full?'#0B0B0B':'#d9d9d9';
    const ps=t>=SEND?lerp(.82,1,e5((t-SEND)/.16)):1;sd.style.transform=`scale(${ps.toFixed(3)})`;sd.querySelector('path').setAttribute('stroke',t>=SEND?'#0B0B0B':'#fff');
    if(t>=SEND){const u=(t-SEND)/(PROMPT_END-SEND);ty-=26*eio(u)}bx.style.transform=`translateY(${ty.toFixed(1)}px)`;
    const m=$('pmeta');const mp=e5((t-TYPE[TYPE.length-1]-.02)/.25);m.style.opacity=mp;m.style.transform=`translateY(${(10*(1-mp)).toFixed(1)}px)`},
  ev:()=>[[HOOK_END,'whoosh'],[ck('s3',1)-.03,'pop'],...TYPE.map((x,i)=>[x,'key',i]),[SEND,'send']]},

 /* 3 · stavba: skutečný kód aplikace (přehraný zrychleně), skutečný čas stavby */
 {id:'build',t0:PROMPT_END,t1:BUILD_END,bg:'#0B0B0B',flash:1,cap:['s5'],capY:668,capStyle:'light',
  fg:()=>`<div class="abs mono" id="bst" style="left:74px;top:138px;font-size:15px;color:#fff;display:flex;align-items:center;gap:9px"><i id="bdot" style="width:10px;height:10px;border-radius:50%;background:var(--y);display:block"></i><span id="bstt">AI píše kód</span></div>
   <div class="abs mono" id="btim" style="right:74px;top:128px;font-size:30px;color:#fff;letter-spacing:.02em">00:00</div>
   <div class="abs mono" id="bsub" style="left:74px;top:168px;font-size:10.5px;color:#8a8a8a;letter-spacing:.06em">skutečný čas stavby · záznam zrychlen</div>
   <div class="ed" id="ed"><div class="tb"><i></i><i></i><i></i><span>index.html</span></div><div class="code" id="code"></div>
     <div class="sb"><span id="bln">řádek 0 / ${NL}</span><span>HTML · CSS · JS</span></div>
     <div class="pal" id="pal"><div class="t">design</div><div class="r">${PALETTE.map(([n,c],i)=>`<div class="w" data-i="${i}"><b style="background:${c}"></b><em>${c}</em></div>`).join('')}</div></div></div>
   <div class="abs" id="brun" style="left:0;right:0;top:146px;text-align:center;opacity:0"><span class="pill" style="background:var(--y);color:var(--k);font-size:17px;padding:8px 16px">▶ Spuštěno v prohlížeči</span></div>`,
  anim:(t)=>{const p=clamp((t-CODE0)/(CODE1-CODE0));const n=Math.min(NL,Math.floor(lerp(0,NL,p))+(t>=CODE0?1:0));
    const V=21,s0=Math.max(0,n-V);let h='';for(let i=s0;i<n;i++)h+=`<div class="ln${i===n-1&&t<DONE?' cur':''}"><u>${i+1}</u>${HL[i]||' '}</div>`;$('code').innerHTML=h;
    $('bln').textContent=`řádek ${n} / ${NL}`;const sec=Math.round(A.build_s*clamp((t-CODE0)/(DONE-CODE0)));
    $('btim').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;$('btim').style.color=t>=DONE?'#FFD400':'#fff';
    $('bstt').textContent=t>=DONE?'Hotovo · aplikace běží':'AI píše kód';$('bdot').style.opacity=t>=DONE?1:(.35+.65*(Math.floor(t*4)%2));
    document.querySelectorAll('#pal .w').forEach(w=>{const a=PAL+.09*(+w.dataset.i);w.style.opacity=t>=a?1:0;w.style.transform=`scale(${t>=a?lerp(.5,1,back((t-a)/.22)).toFixed(3):.5})`});
    $('pal').style.opacity=t>=PAL-.05?1:0;
    const ed=$('ed'),q=eio((t-V0+.05)/.32);ed.style.opacity=1-q;ed.style.transform=`scale(${lerp(1,.86,q).toFixed(4)})`;
    const r=$('brun');r.style.opacity=t>=V0+.1?e5((t-V0-.1)/.25):0;
    ['bst','btim','bsub'].forEach(id=>$(id).style.opacity=1-q)},
  ev:()=>[[PROMPT_END,'dark'],[CODE0,'code',CODE1-CODE0],...PALETTE.map((_,i)=>[PAL+.09*i,'pop',i]),[DONE,'success'],[V0,'launch']]},

 /* 4 · bez jediného řádku od nás */
 {id:'zero',t0:BUILD_END,t1:ZERO_END,bg:'#fff',flash:1,
  fg:()=>`<div class="abs mono" style="left:74px;top:140px;font-size:13px;color:var(--g);letter-spacing:.16em">ŘÁDKY KÓDU</div>
   <div class="abs" style="left:74px;top:176px;font-size:30px;font-weight:750;letter-spacing:-.02em">Napsala AI</div>
   <div class="abs" style="left:70px;top:206px;display:flex;align-items:baseline;gap:12px"><span id="zn" style="font-size:150px;font-weight:850;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums">0</span><span style="font-size:26px;font-weight:700;color:var(--g)">řádků</span></div>
   <div class="abs" style="left:74px;top:372px;width:392px;height:12px;border-radius:6px;background:#efefef"><div id="zbar" style="height:12px;border-radius:6px;background:var(--k);width:0"></div></div>
   <div class="abs" style="left:74px;top:420px;font-size:30px;font-weight:750;letter-spacing:-.02em">Napsali jsme my</div>
   <div class="abs" id="z0" style="left:70px;top:468px;display:flex;align-items:baseline;gap:12px;transform-origin:20% 60%"><span style="font-size:150px;font-weight:850;letter-spacing:-.05em;line-height:1;background:var(--y);padding:0 18px 4px;border-radius:10px">0</span><span style="font-size:26px;font-weight:700;color:var(--g)">řádků</span></div>
   <div class="abs" style="left:74px;top:652px;width:392px;height:12px;border-radius:6px;background:#efefef"><div style="height:12px;width:10px;border-radius:6px;background:var(--y)"></div></div>`,
  anim:(t)=>{const a=BUILD_END+.1,p=eo((t-a)/.85);$('zn').textContent=Math.round(NL*p);$('zbar').style.width=(392*p).toFixed(1)+'px';

  const ramp=clamp((t-DARK)/.6)*(1-clamp((t-SHARE_END+.25)/.25));const ff=clamp((t-FF0)/(FF1-FF0));const boost=1+1.6*Math.sin(Math.PI*ff)*(t<FF1+.1?1:0);

  embers(t);
