<script>
const FPS=30;const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3),e5=x=>1-Math.pow(1-clamp(x),5);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;const $=id=>document.getElementById(id);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function uzel(h,col){const w=h*3.8,sw=h*.12,r=h/2-sw/2;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;display:block"><circle cx="${h/2}" cy="${h/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/><line x1="${h}" y1="${h/2}" x2="${w-h}" y2="${h/2}" stroke="${col}" stroke-width="${sw}"/><circle cx="${w-h/2}" cy="${h/2}" r="${h/2}" fill="#FFD400"/></svg>`}
const T=window.TL;const st=s=>T.S[s][0],en=s=>T.S[s][1];
const CK={};T.chunks.forEach(([s,i,txt,a,b])=>{(CK[s]=CK[s]||[])[i]=[a,b,txt]});
const ck=(s,i)=>CK[s][i][0];
window.DURATION=T.END;
const show=(e,on)=>{e.style.opacity=on?1:0};
function slamT(u,s0=1.35,amp=7){const p=e5(u/.1),k=Math.exp(-Math.max(0,u)/.13);
  return `translate(${(amp*k*Math.sin(u*97+1.1)).toFixed(2)}px,${(amp*.7*k*Math.sin(u*83+.3)).toFixed(2)}px) scale(${lerp(s0,1,p).toFixed(4)})`}
function rgbSplit(u,d=.2,px=6){const r=u>=0&&u<d?px*(1-u/d):0;return r>0?`${r.toFixed(2)}px 0 rgba(255,30,60,.85),${(-r).toFixed(2)}px 0 rgba(0,200,255,.85)`:'none'}
const popIn=(e,t,a,d=.22,s0=.6)=>{e.style.opacity=t>=a?1:0;e.style.transform=`scale(${lerp(s0,1,back((t-a)/d)).toFixed(4)})`};
const slideIn=(e,t,a,dy=24,d=.3)=>{const p=e5((t-a)/d);e.style.opacity=t>=a?p:0;e.style.transform=`translateY(${(dy*(1-p)).toFixed(1)}px)`};
function stars(seed,n=90,h=960){const r=rng(seed);let s=`<svg class="stars" width="540" height="${h}">`;for(let i=0;i<n;i++)s+=`<circle cx="${(r()*540).toFixed(1)}" cy="${(r()*h).toFixed(1)}" r="${(.3+r()*1.1).toFixed(2)}" fill="#fff" opacity="${(.2+r()*.6).toFixed(2)}"/>`;return s+'</svg>'}
const ROCKET=(w,col='#fff')=>`<svg width="${w}" height="${w*5}" viewBox="0 0 24 120" style="display:block;overflow:visible"><path d="M12 0 C16 8 18 17 18 27 L18 100 L23 116 L1 116 L6 100 L6 27 C6 17 8 8 12 0 Z" fill="${col}"/><rect x="6" y="38" width="12" height="2.5" fill="#000" opacity=".55"/><rect x="6" y="88" width="12" height="2.5" fill="#000" opacity=".55"/></svg>`;
const FLAME=(w)=>`<svg class="fl" width="${w}" height="${w*2.2}" viewBox="0 0 20 44" style="display:block;overflow:visible"><path d="M3 0 L17 0 C17 14 13 30 10 44 C7 30 3 14 3 0 Z" fill="#FFB347"/><path d="M6 0 L14 0 C14 10 12 22 10 32 C8 22 6 10 6 0 Z" fill="#FFF3C4"/></svg>`;
/* telemetrický budík (rychlost / výška), SpaceX styl */
function gauge(id,label,unit){return `<div class="abs" id="${id}" style="width:150px;height:150px"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="5" stroke-dasharray="292 98" transform="rotate(130 75 75)"/><circle class="ga" cx="75" cy="75" r="62" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="0 390" transform="rotate(130 75 75)" stroke-linecap="round"/></svg>
  <div class="mono gv" style="position:absolute;left:0;right:0;top:50px;text-align:center;font-size:26px">0</div><div class="lbl" style="position:absolute;left:0;right:0;top:86px;text-align:center;font-size:11px">${label}</div><div class="mono gc" style="position:absolute;left:0;right:0;top:104px;text-align:center;font-size:11px">${unit}</div></div>`}
function setGauge(e,v,max){e.querySelector('.ga').setAttribute('stroke-dasharray',`${(292*clamp(v/max)).toFixed(1)} 390`);e.querySelector('.gv').textContent=fmt(v)}
/* pixelové sprity (vlastní, ne kopie existujících her) */
const SPR={ship:['...x...','..xxx..','.xxxxx.','xx.x.xx','x.....x'],a1:['.x...x.','..xxx..','.xxxxx.','xx.x.xx','xxxxxxx','.x...x.'],a2:['..xxx..','.xxxxx.','x.xxx.x','xxxxxxx','.x.x.x.']};
const sprite=(m,px,col)=>`<svg width="${m[0].length*px}" height="${m.length*px}" viewBox="0 0 ${m[0].length} ${m.length}" shape-rendering="crispEdges" style="display:block">${m.map((r,y)=>[...r].map((c,x)=>c==='x'?`<rect x="${x}" y="${y}" width="1" height="1" fill="${col}"/>`:'').join('')).join('')}</svg>`;

/* ------------------------------------------------------------ scény */
const SCN=[
 /* 1 · háček: Falcon 1, tři selhání, čtvrtý pokus, odpočet T− */
 {id:'hook',from:'s1',cls:'space',cap:1,year:2008,
  html:()=>`${stars(3)}
   <div class="abs lbl" style="left:74px;top:176px;color:#fff">Falcon 1 · Kwajalein</div><div class="abs mono" id="hclk" style="right:74px;top:174px;font-size:15px;color:#fff">T+00:00:00</div>
   <div class="abs" id="hrow" style="left:0;right:0;top:250px;height:240px;transform-origin:50% 0">${[0,1,2].map(i=>`<div class="abs hr" style="left:${150+i*100}px;top:0;width:40px">
     <div class="hrk" style="position:relative">${ROCKET(40)}<div class="hfl" style="position:absolute;left:10px;top:196px">${FLAME(20)}</div></div>
     <div class="hx abs big" style="left:-22px;top:46px;width:84px;text-align:center;font-size:110px;color:var(--red);opacity:0">✕</div>
     <div class="abs mono" style="left:-30px;top:212px;width:100px;text-align:center;font-size:15px">${2006+i}</div>
     <div class="abs mono hfail" style="left:-40px;top:232px;width:120px;text-align:center;font-size:11px;color:var(--red);opacity:0">SELHÁNÍ</div></div>`).join('')}</div>
   <div class="abs" id="h4" style="left:250px;top:300px;width:40px;opacity:0">${ROCKET(40)}<div class="abs" style="left:10px;top:196px">${FLAME(20)}</div><div class="abs mono" style="left:64px;top:70px;font-size:14px;line-height:1.6">LET 4 · 2008<br><span class="red">POSLEDNÍ ŠANCE</span></div></div>
   <div class="abs" id="hmoney" style="left:74px;top:616px;width:392px;opacity:0"><div class="lbl" style="color:#fff">Peníze na další pokus</div><div style="margin-top:8px;height:12px;border:1px solid rgba(255,255,255,.5)"><div id="hmbar" style="height:100%;width:100%;background:var(--red)"></div></div></div>
   <div class="abs mono" id="hcd" style="left:0;right:0;top:548px;text-align:center;font-size:44px;opacity:0">T−00:00:05</div>`,
  anim:(t,s)=>{const X1=ck('s1',2),S2=st('s2')-.06,E2=en('s2');
    $('hclk').textContent='T+00:00:'+String(Math.floor(t)).padStart(2,'0');
    const row=$('hrow'),m=eio((t-S2)/.3);row.style.transform=`translate(${(-120*m).toFixed(1)}px,${(-80*m).toFixed(1)}px) scale(${lerp(1,.45,m).toFixed(4)})`;row.style.opacity=(1-.5*m).toFixed(3);
    s.el.querySelectorAll('.hr').forEach((r,i)=>{const a=X1+i*.14,dead=t>=a;const rk=r.querySelector('.hrk');
      rk.style.transform=dead?`translateY(${(30*eo((t-a)/.6)).toFixed(1)}px) rotate(${((i-1)*14+8)*eo((t-a)/.6)}deg)`:`translateY(${(-6*Math.sin(t*3+i)).toFixed(1)}px)`;
      rk.style.opacity=dead?(.35+.65*Math.exp(-(t-a)/.15)).toFixed(3):1;r.querySelector('.hfl').style.opacity=dead?0:(.75+.25*Math.sin(t*40+i)).toFixed(2);
      const x=r.querySelector('.hx');x.style.opacity=dead?1:0;if(dead)x.style.transform=slamT(t-a,1.8,6);r.querySelector('.hfail').style.opacity=dead?1:0});
    const f=$('h4');f.style.opacity=t>=S2+.1?1:0;f.style.transform=`translateY(${(40*(1-e5((t-S2-.1)/.35))).toFixed(1)}px)`;f.querySelector('.fl').style.opacity=(.7+.3*Math.sin(t*45)).toFixed(2);
    const mo=$('hmoney');mo.style.opacity=clamp((t-S2-.25)/.15);$('hmbar').style.width=(100*lerp(1,.08,eo((t-S2-.3)/1.2))).toFixed(1)+'%';$('hmbar').style.opacity=t>S2+1.3&&Math.floor(t*6)%2?'.35':'1';
    const cd=$('hcd');cd.style.opacity=t>=S2+.15?1:0;const left=Math.max(0,E2-t);cd.textContent='T−00:00:0'+Math.ceil(left*5/(E2-S2)).toString().slice(-1);cd.style.color=left<.4?'var(--red)':'#fff'},
  ev:s=>{const X1=ck('s1',2),S2=st('s2')-.06,E2=en('s2');const E=[[0,'hum',S2],[X1,'boom',1],[X1+.14,'boom',.8],[X1+.28,'boom',.9],[X1,'shk',7],[X1+.28,'shk',6]];

 /* 2 · jméno: portrét na černé, start rakety (= obálka videa) */
 {id:'name',from:'s3',cls:'space',cap:0,year:1971,tr:'flash',
  html:()=>`${stars(7,120)}<div class="abs" style="inset:0;background:${SUN_RED}"></div>
   <div class="abs big" id="nn1" style="left:0;right:0;top:150px;text-align:center;font-size:178px;letter-spacing:.02em">ELON</div>

   <img class="abs" id="ncut" src="photos/musk_cut.png" style="left:66px;top:286px;width:408px;height:566px;-webkit-mask-image:linear-gradient(#000 74%,transparent 96%)">

  anim:(t,s)=>{const u=t-s.t0;const c=$('ncut');c.style.opacity=clamp(u/.12);c.style.transform=`translateY(${(40*(1-e5(u/.4))).toFixed(1)}px) scale(${(1.04-.04*e5(u/.6)).toFixed(4)})`;

 /* 3 · Blastar: hra ve 12 letech, prodaná za 500 $ */
